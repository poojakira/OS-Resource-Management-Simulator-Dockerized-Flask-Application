name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: resource_control_test
          POSTGRES_USER: resource_control
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resource_control -d resource_control_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://resource_control:ci-only-password@127.0.0.1:5432/resource_control_test
      DATABASE_URL: postgresql+psycopg://resource_control:ci-only-password@127.0.0.1:5432/resource_control_test
      RESOURCE_API_KEYS: ci:admin:ci-only-key-000000000000000000000000

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Migration validation
        run: |
          alembic upgrade head
          python -c "import os; from sqlalchemy import create_engine, inspect; tables=set(inspect(create_engine(os.environ['DATABASE_URL'])).get_table_names()); required={'resources','leases','audit_events','idempotency_records'}; assert required <= tables, f'missing tables: {sorted(required-tables)}'"

      - name: Tests including PostgreSQL concurrency
        run: python -m pytest

      - name: Static security scan
        run: python -m bandit -q -r resource_control wsgi.py

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt

      - name: Docker build
        run: docker build -t resource-control-plane:ci .

      - name: Compose validation
        env:
          POSTGRES_PASSWORD: ci-compose-password
          RESOURCE_API_KEYS: ci:admin:ci-only-key-000000000000000000000000
        run: docker compose config --quiet
